<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <title>Costly Colours</title>
  </head>
  <body>
    <header>
        <h1>Costly Colours</h1>
        <nav>
            <a href="instructions.html">Instructions</a>
            <a href="https://en.wikipedia.org/wiki/Costly_Colours">History</a>
        </nav>
    </header>
    <main>
        <p> 
            "A fascinating relative to cribbage, with more complexity of combinations"
        </p>
        <section>
            <h2>Gameplay</h2>
            <div id="start"> 
                <h3> {{ c_title }} </h3>
                
                <button value="GO">Start Game</button>
            </div> <br>

            <div id="pre_peg">
                <p> {{ message }}</p>
            </div>

            <div id="mogg">
            <form method="POST">
                <label>Mogg? (Y/N):</label>
                <label><input type="radio" name="mogg" value="Y" /> Yes</label>
                <label><input type="radio" name="mogg" value="N" /> No</label>
                <button>Submit</button>
            </form><br>
            </div>

            <div id="total_messages">

            </div>
            <div id="hands">

            </div>

            <div id="card_choice">
                <form method="POST">
                    <button name="card" value="0">Play Card 1</button>
                    <button name="card" value="1">Play Card 2</button>
                    <button name="card" value="2">Play Card 3</button>
                </form>
            </div>
        </section>

        <section>
            <h2>Statistics</h2>
        </section>
    </main>
    <footer>
        <p>Made by Shenard Williams, Duke University (Pratt 2029), 2026</p>
    </footer>
  </body>
</html>
